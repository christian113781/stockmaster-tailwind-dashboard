<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page Not Found — Inventory Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/main.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { poppins: ['Poppins', 'sans-serif'] },
          colors: {
            brand: {
              50:  '#f0f4ff', 100: '#e0eaff', 200: '#c7d7fd',
              400: '#818cf8', 500: '#6366f1', 600: '#4f46e5',
              700: '#4338ca', 900: '#1e1b4b',
            },
          },
          boxShadow: {
            card: '0 1px 4px 0 rgba(99,102,241,.08), 0 4px 16px 0 rgba(99,102,241,.06)',
          },
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="font-poppins text-gray-800 antialiased bg-[#f8f9fc] dark:bg-[#0f1117]" x-data="notFoundPage()" x-cloak>

<a href="#main" class="skip-link">Skip to main content</a>

<div class="relative min-h-[100dvh] flex items-center justify-center px-4 py-10 overflow-hidden">

  <!-- ambient background -->
  <div class="pointer-events-none absolute inset-0 opacity-[0.05] dark:opacity-[0.08]" aria-hidden="true"
       style="background-image:radial-gradient(circle,#6366f1 1px,transparent 1px);background-size:26px 26px;"></div>
  <div class="pointer-events-none absolute top-[-10%] start-[-6%] w-80 h-80 rounded-full bg-brand-200/40 dark:bg-brand-500/10 blur-3xl" aria-hidden="true"></div>
  <div class="pointer-events-none absolute bottom-[-14%] end-[-8%] w-96 h-96 rounded-full bg-violet-200/40 dark:bg-violet-500/10 blur-3xl" aria-hidden="true"></div>

  <main id="main" tabindex="-1" class="relative w-full max-w-lg text-center">

    <!-- Dark mode toggle -->
    <div class="flex justify-end mb-4">
      <button @click="toggleDark()"
              class="dark-toggle text-gray-500 hover:bg-gray-100 dark:hover:bg-white/10"
              :aria-label="isDark ? 'Switch to light mode' : 'Switch to dark mode'">
        <svg class="icon-sun w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
        <svg class="icon-moon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
      </button>
    </div>

    <!-- Illustration: a "misplaced package" scene -->
    <div class="relative mx-auto w-56 h-56 mb-2" aria-hidden="true">
      <svg viewBox="0 0 220 220" class="w-full h-full">
        <defs>
          <linearGradient id="crateGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#818cf8"/>
            <stop offset="100%" stop-color="#4f46e5"/>
          </linearGradient>
        </defs>

        <!-- floor shadow -->
        <ellipse cx="110" cy="182" rx="62" ry="10" class="fill-brand-900/10 dark:fill-black/30"/>

        <!-- backdrop ring -->
        <circle cx="110" cy="100" r="92" class="fill-brand-50 dark:fill-[#1a1d2c]"/>

        <!-- floating shelf line -->
        <rect x="30" y="150" width="160" height="6" rx="3" class="fill-brand-100 dark:fill-[#2d3148]"/>

        <!-- crate (the "missing item") tipped over -->
        <g transform="translate(110,118) rotate(-8)">
          <rect x="-38" y="-30" width="76" height="60" rx="8" fill="url(#crateGrad)"/>
          <rect x="-38" y="-30" width="76" height="16" rx="8" class="fill-white/15"/>
          <path d="M-38 -2 H38 M-8 -30 L-8 30 M8 -30 L8 30" stroke="rgba(255,255,255,.35)" stroke-width="2.5" fill="none"/>
        </g>

        <!-- magnifying glass with ? -->
        <g transform="translate(150,72)">
          <circle r="26" class="fill-white dark:fill-[#12151f] stroke-brand-400" stroke-width="4"/>
          <text x="0" y="9" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="700" font-size="26" class="fill-brand-500">?</text>
          <line x1="19" y1="19" x2="34" y2="34" class="stroke-brand-400" stroke-width="6" stroke-linecap="round"/>
        </g>

        <!-- scattered dots -->
        <circle cx="56" cy="60" r="4" class="fill-brand-200 dark:fill-brand-500/30"/>
        <circle cx="176" cy="128" r="5" class="fill-amber-300"/>
        <circle cx="44" cy="128" r="3" class="fill-emerald-300"/>
      </svg>
    </div>

    <p class="display-num font-bold text-brand-600 text-5xl sm:text-6xl tracking-tight">404</p>
    <h1 class="text-xl sm:text-2xl font-bold text-gray-900 dark:text-gray-100 mt-2">This item isn't in stock</h1>
    <p class="text-sm text-gray-500 dark:text-gray-400 mt-2 max-w-sm mx-auto">
      The page you're looking for doesn't exist, may have been moved, or the URL was typed incorrectly.
    </p>

    <div class="flex flex-col sm:flex-row items-center justify-center gap-3 mt-8">
      <a href="index.html"
         class="flex items-center justify-center gap-2 px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold rounded-xl transition-colors shadow-sm min-h-[44px] w-full sm:w-auto">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Back to Dashboard
      </a>
      <button type="button" onclick="history.back()"
              class="flex items-center justify-center gap-2 px-5 py-2.5 border border-gray-200 dark:border-[#374151] text-gray-700 dark:text-gray-200 text-sm font-semibold rounded-xl hover:bg-gray-50 dark:hover:bg-white/5 transition-colors min-h-[44px] w-full sm:w-auto">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Go Back
      </button>
    </div>

    <!-- quick links -->
    <div class="mt-10 pt-6 border-t border-gray-100 dark:border-[#2d3148]">
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Or jump to</p>
      <div class="flex flex-wrap items-center justify-center gap-2">
        <a href="products.html" class="px-3 py-1.5 text-xs font-medium rounded-full bg-white dark:bg-[#1e2133] border border-gray-200 dark:border-[#2d3148] text-gray-600 dark:text-gray-300 hover:border-brand-400 hover:text-brand-600 transition-colors">Products</a>
        <a href="purchase-orders.html" class="px-3 py-1.5 text-xs font-medium rounded-full bg-white dark:bg-[#1e2133] border border-gray-200 dark:border-[#2d3148] text-gray-600 dark:text-gray-300 hover:border-brand-400 hover:text-brand-600 transition-colors">Purchase Orders</a>
        <a href="suppliers.html" class="px-3 py-1.5 text-xs font-medium rounded-full bg-white dark:bg-[#1e2133] border border-gray-200 dark:border-[#2d3148] text-gray-600 dark:text-gray-300 hover:border-brand-400 hover:text-brand-600 transition-colors">Suppliers</a>
        <a href="warehouses.html" class="px-3 py-1.5 text-xs font-medium rounded-full bg-white dark:bg-[#1e2133] border border-gray-200 dark:border-[#2d3148] text-gray-600 dark:text-gray-300 hover:border-brand-400 hover:text-brand-600 transition-colors">Warehouses</a>
      </div>
    </div>
  </main>
</div>

<script>
function notFoundPage() {
  return {
    ...sharedChrome('404.html'),
  };
}
</script>
</body>
</html>
