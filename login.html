<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign In — Inventory Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/main.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { poppins: ['Poppins', 'sans-serif'] },
          colors: {
            brand: {
              50:  '#f0f4ff', 100: '#e0eaff', 200: '#c7d7fd',
              400: '#818cf8', 500: '#6366f1', 600: '#4f46e5',
              700: '#4338ca', 900: '#1e1b4b',
            },
          },
          boxShadow: {
            card: '0 1px 4px 0 rgba(99,102,241,.08), 0 4px 16px 0 rgba(99,102,241,.06)',
          },
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="font-poppins text-gray-800 antialiased bg-[#f8f9fc] dark:bg-[#0f1117]" x-data="loginPage()" x-cloak>

<a href="#main" class="skip-link">Skip to main content</a>

<!-- ════ TOAST ════ -->
<div id="toast" role="status" aria-live="polite" aria-atomic="true" :class="{ show: toast.show }">
  <svg class="w-4 h-4 text-emerald-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
  </svg>
  <span x-text="toast.msg">Signed in successfully!</span>
</div>

<div class="min-h-[100dvh] flex items-center justify-center px-4 py-10">
  <main id="main" tabindex="-1" class="w-full max-w-md">

    <!-- Dark mode toggle -->
    <div class="flex justify-end mb-4">
      <button @click="toggleDark()"
              class="dark-toggle text-gray-500 hover:bg-gray-100 dark:hover:bg-white/10"
              :aria-label="isDark ? 'Switch to light mode' : 'Switch to dark mode'">
        <svg class="icon-sun w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
        <svg class="icon-moon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
      </button>
    </div>

    <!-- Logo -->
    <div class="flex flex-col items-center gap-3 mb-8">
      <div class="w-12 h-12 rounded-2xl bg-brand-600 flex items-center justify-center flex-shrink-0" aria-hidden="true">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
        </svg>
      </div>
      <div class="text-center">
        <p class="text-lg font-bold text-gray-900 dark:text-gray-100 leading-tight">StockMaster</p>
        <p class="text-[11px] text-gray-400 font-medium tracking-wide uppercase">Inventory Pro</p>
      </div>
    </div>

    <!-- Card -->
    <div class="bg-white dark:bg-[#1e2133] rounded-2xl shadow-card p-6 sm:p-8">
      <div class="mb-6 text-center">
        <h1 class="text-xl font-bold text-gray-900 dark:text-gray-100">Welcome back</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Sign in to your account to continue</p>
      </div>

      <form @submit.prevent="submitLogin" novalidate class="space-y-4">
        <!-- Email -->
        <div>
          <label for="login-email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Email address</label>
          <input id="login-email" type="email" class="field" :class="{ error: errors.email }"
                 x-model.trim="form.email" placeholder="e.g. juan@stockmaster.ph" autocomplete="email"
                 aria-describedby="login-email-err">
          <p id="login-email-err" class="text-xs text-red-500 mt-1" x-show="errors.email" x-cloak>Please enter a valid email address.</p>
        </div>

        <!-- Password -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="login-password" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Password</label>
            <a href="#" class="text-xs font-semibold text-brand-600 hover:text-brand-700">Forgot password?</a>
          </div>
          <div class="relative">
            <input :type="showPw ? 'text' : 'password'" id="login-password" class="field pe-11" :class="{ error: errors.password }"
                   x-model="form.password" placeholder="Enter your password" autocomplete="current-password"
                   aria-describedby="login-password-err">
            <button type="button" @click="showPw = !showPw"
                    class="absolute end-2.5 top-1/2 -translate-y-1/2 p-1.5 rounded-lg text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-white/10 transition-colors"
                    :aria-label="showPw ? 'Hide password' : 'Show password'">
              <svg x-show="!showPw" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <svg x-show="showPw" x-cloak class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
            </button>
          </div>
          <p id="login-password-err" class="text-xs text-red-500 mt-1" x-show="errors.password" x-cloak>Password is required.</p>
        </div>

        <!-- Remember me -->
        <div class="flex items-center gap-2">
          <input id="login-remember" type="checkbox" x-model="form.remember"
                 class="w-4 h-4 rounded border-gray-300 text-brand-600 focus:ring-brand-400">
          <label for="login-remember" class="text-sm text-gray-600 dark:text-gray-300">Remember me for 30 days</label>
        </div>

        <!-- General error -->
        <p class="text-xs text-red-500 text-center" x-show="errors.general" x-cloak x-text="errors.general"></p>

        <button type="submit"
                class="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold rounded-xl transition-colors shadow-sm min-h-[44px]">
          Sign In
        </button>
      </form>

      <!-- Divider -->
      <div class="flex items-center gap-3 my-6">
        <div class="flex-1 h-px bg-gray-100 dark:bg-[#2d3148]"></div>
        <span class="text-xs text-gray-400 font-medium">OR</span>
        <div class="flex-1 h-px bg-gray-100 dark:bg-[#2d3148]"></div>
      </div>

      <button type="button" @click="showToast('Google sign-in is not connected in this demo.')"
              class="w-full flex items-center justify-center gap-2 px-4 py-2.5 border border-gray-200 dark:border-[#374151] text-gray-700 dark:text-gray-200 text-sm font-semibold rounded-xl hover:bg-gray-50 dark:hover:bg-white/5 transition-colors min-h-[44px]">
        <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47c-.28 1.5-1.13 2.78-2.4 3.63v3.02h3.88c2.27-2.09 3.58-5.17 3.58-8.84z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.9l-3.88-3.02c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.26v3.12A11.997 11.997 0 0012 24z"/>
          <path fill="#FBBC05" d="M5.27 14.27A7.2 7.2 0 014.9 12c0-.79.14-1.56.37-2.27V6.61H1.26A11.997 11.997 0 000 12c0 1.94.46 3.77 1.26 5.39l4.01-3.12z"/>
          <path fill="#EA4335" d="M12 4.77c1.76 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.69 1.26 6.61l4.01 3.12C6.22 6.88 8.87 4.77 12 4.77z"/>
        </svg>
        Continue with Google
      </button>

      <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-6">
        Don't have an account?
        <a href="register.html" class="font-semibold text-brand-600 hover:text-brand-700">Create one</a>
      </p>
    </div>

    <p class="text-center text-xs text-gray-400 dark:text-gray-500 mt-6">
      <a href="index.html" class="hover:text-brand-600 transition-colors">← Back to dashboard</a>
    </p>
  </main>
</div>

<script>
function loginPage() {
  return {
    ...sharedChrome('login.html'),
    showPw: false,
    form: { email: '', password: '', remember: false },
    errors: {},

    validate() {
      this.errors = {};
      let ok = true;
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.form.email);
      if (!emailOk)          { this.errors.email = true; ok = false; }
      if (!this.form.password) { this.errors.password = true; ok = false; }
      return ok;
    },
    submitLogin() {
      if (!this.validate()) return;
      this.showToast('Signed in successfully!');
      setTimeout(() => { window.location.href = 'index.html'; }, 900);
    },
  };
}
</script>
</body>
</html>
